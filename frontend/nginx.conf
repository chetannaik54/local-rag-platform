server {
  listen 80;
  client_max_body_size 60m;
  root /usr/share/nginx/html;
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_buffering off;          # keep SSE tokens flowing
    proxy_read_timeout 300s;
  }
  location = /widget.js { proxy_pass http://backend:8000; }
  location = /widget-demo { proxy_pass http://backend:8000; }
  location / { try_files $uri /index.html; }
}
